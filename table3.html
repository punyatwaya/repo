<!DOCTYPE html>
<html>
<head>
    <title>Seminar Table</title>
</head>
<body>

    <table border="1" cellpadding="10" cellspacing="0">

                <th rowspan="2">Topic</th>
            </tr>
            <tr>
                <th>Start</th>
                <th>End</th>

        <tbody>
            <tr>
                <td rowspan="3">Monday</td>
                <td>08:00 AM</td>
                <td>05:00 PM</td>

            </tr>
            <tr>
                <td>08:00 AM</td>
                <td>11:00 PM</td>
                <td>Uses</td>
            </tr>
            <tr>
                <td colspan="2"></td>
                <td>–</td>
            </tr>

        
            <tr>
                <td rowspan="3">Tuesday</td>
                <td>11:00 AM</td>
                <td>02:00 PM</td>
                <td>Learn</td>
            </tr>
            <tr>
                <td>02:00 PM</td>
                <td></td>
                <td>–</td>
            </tr>
            <tr>
                <td>10:00 AM</td>
                <td>01:00 PM</td>
                <td></td>
            </tr>

            <tr>
                <td>Wed-Fri</td>
                <td colspan="2">Full Day</td>
                <td>Practical</td>
            </tr>
            <tr>
                <td>Sat-Sun</td>
                <td>11:00 AM</td>
                <td>05:00 PM</td>
                <td>Extra Class</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
