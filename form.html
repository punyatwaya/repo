<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
</head>
<body>
  <h2>Contact Form</h2>
  <form action="#" method="post" enctype="multipart">
    
    
    
    <input type="text" id="name" name="name" placeholder="name"><br><br>
    <input type="email" id="email" name="email" placeholder="@gmail.com"><br><br>
    <input type="number" id="phone" name="phone" placeholder="phone no"><br><br>
    <input type="text" id="subject" name="subject" placeholder="subject"><br><br>

    
    <input type="date" id="date" name="date" placeholder="date"><br><br>
    <input type="file" id="image" name="image" accept="image/*"><br><br>
    
    <textarea id="message" name="message" rows="4" cols="40" placeholder="message"></textarea><br><br>

    <input type="submit" value="Submit">

  </form>
</body>
</html>
