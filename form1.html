<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Ticket Booking for a Movie Theatre</h2>
    <form action="#" method="post" enctype="multipart/form-data">
        <input type="text" id="name" name="name" placeholder="name"><br><br>
        <input type="email" id="email" name="email" placeholder="@gmail.com"><br><br>
        <input type="number" id="tel" name="tel" placeholder="phone no"><br><br>
        <input type="date" id="date" name="date" placeholder="date"><br><br>
        <select name="Movie" id="Movie">
            <option value="">Select Movie</option>
            <option value="Movie1">Housefull 5</option>
            <option value="Movie2">Bhool Chuk Maaf</option>
            <option value="Movie3">Thug Life</option>
            <option value="Movie4">Raid 2</option>
        </select><br><br>
        <input type="time" id="time" name="time" placeholder="time"><br><br>
        <!-- <select name="Timing" id="Timing">
            <option value="">Select Timing</option>
            <option value="10am">10.00AM</option>
            <option value="1PM">1.00PM</option>
            <option value="4PM">4.00PM</option>
             <option value="7PM">7.00PM</option>
        </select><br><br> -->
        <select name="Seat" id="Seat">
            <option value="">Select Seat Type</option>
            <option value="Regular">Regular</option>
            <option value="Premium">Premium</option>
            <option value="Vip">vip</option>
        </select><br><br>
        <input type="number" id="number" name="number" placeholder="Ticket Number"><br><br>
        <select name="Payment Mode" id="Payment Mode">
            <option value="">Payment Mode</option>
            <option value="Cash">cash</option>
            <option value="UPI">UPI</option>
            <option value="Card">Card</option>
        </select><br><br>
        <textarea name="message" id="message" placeholder="Additional Comments" rows="4" cols="40"></textarea><br><br>
        <input type="submit" placeholder="Submit">

    </form>
</body>
</html>
