<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>input type example</h2>
    <form action="#" method="post" enctype="multipart/form-data">
         <input type="text" id="name" name="name" placeholder="name"><br><br>
        <input type="email" id="email" name="email" placeholder="@gmail.com"><br><br>
        <input type="number" id="number" name="number" placeholder="phone no"><br><br>
        <input type="date" id="date" name="date"><br><br>
        <input type="datetime-local" name="datetime-local" name="datetime-local"><br><br>
        <input type="time" id="Time" name="Time"><br><br>
        <input type="password" id="password" name="password" placeholder="password"><br><br>
        <input type="file" id="file" name="file" placeholder="file"><br><br>
        <input type="image" id="image" name="image" placeholder="image"><br><br>
        <input type="url" id="url" name="url" placeholder="url"><br><br>
        <input type="color" id="color" name="color" placeholder="color"><br><br>
        <input type="search" id="search" name="search" placeholder="search"><br><br>
        <input type="hidden" id="hidden" name="hidden" placeholder="hidden"><br><br>
        <textarea name="Comments" id="Comments" placeholder="Comments"></textarea><br><br>
        <input type="reset" id="reset" name="reset" placeholder="reset">
        <input type="submit" id="submit" name="submit" placeholder="submit"><br><br>
        
        
         </form>
</body>
</html>
